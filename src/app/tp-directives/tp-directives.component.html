<div>
    <h2 class="text-4xl text-center p-2 my-2">TP - Directives</h2>
    <div class="flex justify-center my-4">
        <button (click)="toggleDetails()" class="w-96 text-white text-center bg-blue-700 hover:bg-blue-800 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2">{{ btnText }}</button>
    </div>
    <div *ngIf="toggle">
        <p [ngClass]="{whiteText:num>4}" *ngFor="let num of arr" [ngStyle]="{backgroundColor: toggleColor(num)}">{{ num }}</p>
    </div>
</div>
